name: CI Pipeline

# 本仓只由 Gitea 跑 Actions：GitHub（xfengyin/Protocol-algorithm）只是 Gitea 的 push mirror，
# 只读、**不跑 Actions**（GitHub 只读 .github/workflows/，而本仓的 workflow 全在 .gitea/workflows/）。
# 因此本文件里不再保留 `github.server_url == 'https://github.com'` 的 GitHub 分支，
# 也不再为同一个 artifact 写两份 action —— 那些分支结构上不可达，属于死配置。
# runs-on 一律直写真实存在的标签：本仓全部 job 落 NAS（amd64），板上没有 github_mirror 拉不动 action。

# 2026-10-10 修：本仓库默认分支是 master，但下面的触发分支只写了 main/develop，
# 结果 CI **从来没在默认分支上跑过**（实测：推到 master 的提交不产生任何 run，
# 最新 run 还停在 09-29 的手动/PR 触发）。全集群 33 个 push 触发的 workflow 里只有这一处不匹配，
# 其余 master-default 仓库（leach / kongming / maaautonaruto / lenovotool2 / zhihu-salt-*）
# 都把 master 列进去了 —— 这里按同一约定补上，纯增量、不减少任何覆盖。
on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # 实测（19:34，同一分钟内）：pypi.tuna 0.28s / mirrors.aliyun 0.31s / pypi.org 1.09s，
  # 走 Pi 代理也不改变这个差距。原本 workflow 没设 index，pip 直接打 pypi.org，
  # 于是 task 1135 的 `pip install -r requirements.txt` 跑了 40+ 分钟还没结束
  # （进程活着但只占 1.1% CPU，卡在 443 上，属于典型的下载停滞而非编译）。
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  # 失败要快：默认 pip 会重试 5 次、每次等 15s，叠加成几十分钟的静默等待。
  PIP_DEFAULT_TIMEOUT: "15"
  PIP_RETRIES: "2"

# 同一分支的新 run 直接取代旧的：本机只有 2 个 runner 槽位，重复排队会重复跑完整构建
# （picoclaw 一次 build-all 实测 30+ 分钟）。cancel-in-progress 用 false 时只要有一个 run
# 卡住，整个并发组会被永久毒死（2026-10-09 在 mimiclaw-orangepi 上踩过）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # -------------------------------------------
  # 代码质量检查
  # -------------------------------------------
  lint:
    name: Code Quality Check
    runs-on: amd64
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # 不再用 setup-python 自带的 pip 缓存：它在 post 步骤里把 ~/.cache/pip 全部 zstd 压缩一遍
          # （实测 1.8GB 轮子压了 15 分钟以上，job 因此从 8 分钟变成 33 分钟）。
          # 改为 runner 侧把宿主 /vol1/pip-cache 挂到 ~/.cache/pip —— 零拷贝、跨 job 复用。

      - name: Create venv (隔离共享 toolcache)
        # act_runner 会把同一个 act-toolcache 卷挂进所有 job 容器的 /opt/hostedtoolcache，
        # 并发 job 直接 pip install 进 toolcache 的 Python 会互相覆盖，实测报
        #   OSError: [Errno 2] No such file or directory: .../isort-5.13.2.dist-info/RECORD*.tmp
        # （run #911 的 Code Quality Check 就是这么红的，同轮 Security Scan 绿）。
        # 每个 job 自建 venv：依赖只写 workspace 卷，toolcache 的 Python 只被只读使用。
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install black==24.3.0 isort==5.13.2 flake8==7.0.0 mypy==1.9.0
          # 只有类型存根，不是运行时依赖：本 job 不装 requirements.txt，
          # 缺 types-PyYAML 时 mypy 会报 src/config/validator.py:10 import-untyped。
          .venv/bin/pip install types-PyYAML==6.0.12.20240311

      # 覆盖范围：src/ tests/ examples/ + 两个入口脚本 + 包根。此前只查 src/ 与 tests/，
      # examples/（2184 行，README 当公开用法推荐给用户）和 main.py / cli.py 完全不受门禁保护。
      - name: Check Black formatting
        run: |
          .venv/bin/black --check --diff src/ tests/ examples/ main.py cli.py __init__.py

      - name: Check import sorting
        run: |
          .venv/bin/isort --check-only --diff src/ tests/ examples/ main.py cli.py __init__.py

      - name: Run flake8
        # 规则只留一份：.flake8（flake8 从当前目录自动发现它）。
        # 以前命令行又把 max-line-length / extend-ignore / per-file-ignores 重复写了一遍，
        # 于是同一套规则有两处真相源 —— 改一处漏一处就会出现「本地绿、CI 红」（88 vs 100 就这么来过）。
        # 这里只传路径（fl8 不带路径会递归扫到 .venv/）和 --statistics（报告形式，不是规则）。
        run: |
          .venv/bin/flake8 src/ tests/ examples/ main.py cli.py __init__.py --statistics

      - name: Run mypy type check
        # 硬门禁（2026-10-15）：此前是 `continue-on-error: true`，注释自述「存量 47 个类型错误」。
        # 实测存量是 **41 个 / 13 个文件**（mypy 1.9.0，run #915 日志），已全部清零 -> 去掉软开关。
        # 根因多是「声明返回 float/dict 却直接返回 Any 表达式」（本 job 不装 numpy/torch/sklearn，
        # --ignore-missing-imports 让它们都是 Any）：修法是显式 float(...) 或显式标注容器类型，
        # 不改数值行为、不改公开签名。
        run: |
          .venv/bin/mypy src/ tests/ examples/ main.py cli.py __init__.py --ignore-missing-imports \
            --no-strict-optional \
            --warn-unused-ignores \
            --explicit-package-bases

      - name: Verify mypy gate can fail (negative control)
        # 同其它门禁：基线是「0 错误」，所以必须先证明这个检查真的会报错。
        # 给 mypy 一个必然该被报出的输入（str 赋给 int 变量 / 返回类型不符），断言它非零退出。
        run: |
          probe=/tmp/mypy-negative-control
          rm -rf "$probe" && mkdir -p "$probe"
          printf '%s\n' 'y: int = "not an int"' 'def f() -> int:' '    return "no"' > "$probe/planted.py"
          if .venv/bin/mypy "$probe/planted.py" --ignore-missing-imports --no-strict-optional \
               > "$probe/out.txt" 2>&1; then
            echo "::error::mypy 门禁失效：对必然出错的输入没有报错（该检查本身不可信）"
            cat "$probe/out.txt"
            exit 1
          fi
          echo "negative control OK：mypy 对植入的类型错误返回非零"
          cat "$probe/out.txt"

  # -------------------------------------------
  # 安全扫描
  # -------------------------------------------
  security:
    name: Security Scan
    runs-on: amd64
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv (隔离共享 toolcache)
        # act_runner 会把同一个 act-toolcache 卷挂进所有 job 容器的 /opt/hostedtoolcache，
        # 并发 job 直接 pip install 进 toolcache 的 Python 会互相覆盖，实测报
        #   OSError: [Errno 2] No such file or directory: .../isort-5.13.2.dist-info/RECORD*.tmp
        # （run #911 的 Code Quality Check 就是这么红的，同轮 Security Scan 绿）。
        # 每个 job 自建 venv：依赖只写 workspace 卷，toolcache 的 Python 只被只读使用。
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install security tools
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install bandit==1.7.8
      # 依赖漏洞审计**不在这里**：本 job 不装 requirements.txt（装了要 20 分钟），
      # 而改造前的 `safety check`（无目标）审的是本 job 自己那个 venv（bandit 的依赖），
      # 即便跑通也是审错对象。审计已移到 test job（那里装有全量依赖，见下方 test job）。

      - name: Run Bandit security scan
        # 硬门禁：退出码即判据 —— 扫出 >=medium 严重度/置信度的问题 -> 非零 -> job 红。
        # 这里**不用 `|| true`**（那是把门禁变装饰）：只用 `set +e` 把退出码捞出来，
        # 先把报告打进日志（红了能直接看到原因），再把原退出码还回去。
        # 存量登记：src/ai/sklearn_selector.py 的 pickle.load（B301）已在源码里带理由 nosec，
        # 其余任何 >=medium 的新问题都会让本步红。
        run: |
          set +e
          .venv/bin/bandit -r src/ \
            --format=custom \
            --confidence-level=medium \
            --severity-level=medium \
            --exclude=tests/ \
            --output=bandit-report.txt
          rc=$?
          echo "bandit exit code = $rc (0=无 >=medium 问题)"
          echo "---------------- bandit-report.txt ----------------"
          if [ -f bandit-report.txt ]; then cat bandit-report.txt; else echo "(bandit 没有产出报告文件)"; fi
          exit $rc

      - name: Verify Bandit gate can fail (negative control)
        # 「空输出不能自证清白」：一个永远不报的检查和一个没有问题的仓库，输出完全一样。
        # 本步给 bandit 一个必然该被报出的输入，断言它确实返回非零。
        # 若 bandit 哪天静默失效（插件/版本变化），这一步先红，而不是大家以为门禁还在。
        run: |
          probe=/tmp/bandit-negative-control
          rm -rf "$probe" && mkdir -p "$probe"
          printf '%s\n' \
            'import subprocess' \
            'PASSWORD = "hunter2"' \
            'def bad(text):' \
            '    return eval(text)' \
            'def sh(cmd):' \
            '    return subprocess.Popen(cmd, shell=True)' \
            > "$probe/planted.py"
          if .venv/bin/bandit -r "$probe" \
               --confidence-level=medium --severity-level=medium --format=custom > "$probe/out.txt" 2>&1; then
            echo "::error::Bandit 门禁失效：对必然违规的输入没有报错（该检查本身不可信）"
            cat "$probe/out.txt"
            exit 1
          fi
          echo "negative control OK：bandit 对植入的违规样本返回非零"
          cat "$probe/out.txt"

      - name: Upload security reports
        # @v3 是 Gitea 唯一可用的 artifact API（@v4+ 会被 action 自判 GHES 后拒绝执行）
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: bandit-report.txt
          retention-days: 30

  # -------------------------------------------
  # 单元测试与覆盖率
  # -------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    # runs-on 写死 amd64（NAS）。历史上这里用 matrix.os 当 runs-on，绕过标签治理：
    # 本机 opi-runner-1 也声明了 ubuntu-latest，于是 python 测试 job 有约一半概率落到
    # 1.4G 的 OrangePi 上 —— 而 Pi 的 act_runner 没配 github_mirror，连 action 都拉不下来
    # （run#902 的两个 Test job 被派到 opi-runner-1，其一 st=2 失败）。
    runs-on: amd64
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # 同 lint job：pip 缓存走 runner 挂载的宿主目录，不用 setup-python 的 cache（它太慢）

      - name: Create venv (隔离共享 toolcache)
        # act_runner 会把同一个 act-toolcache 卷挂进所有 job 容器的 /opt/hostedtoolcache，
        # 并发 job 直接 pip install 进 toolcache 的 Python 会互相覆盖，实测报
        #   OSError: [Errno 2] No such file or directory: .../isort-5.13.2.dist-info/RECORD*.tmp
        # （run #911 的 Code Quality Check 就是这么红的，同轮 Security Scan 绿）。
        # 每个 job 自建 venv：依赖只写 workspace 卷，toolcache 的 Python 只被只读使用。
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pytest==8.1.1 pytest-cov==5.0.0 pytest-xdist==3.5.0
          .venv/bin/pip install pip-audit==2.10.1

      - name: Run tests with coverage
        # 覆盖率门禁（P4）：阈值不是拍出来的，是先量化再定的 ——
        # 存量实测 = **1930 行中 858 行被覆盖**，即 lines-valid=1930 / lines-covered=858 /
        # line-rate=0.4446（44.46%），来源是 CI 自己产出的 coverage.xml 工件：
        # run 10185 与 run 10191 两次独立运行数字完全相同（858/1930），说明这个量是可复现的，
        # 不是跑一次的偶然值。阈值取 floor(44.46) = **44**：
        #   * 语义 = 「存量不许下降，新增未覆盖代码要还债」；
        #   * 容差 = 0.46 个百分点 ≈ 9 条语句（0.46% × 1930）—— 改个变量名、加两行日志不会误伤，
        #     但新增一个几十行的未测模块立刻红。
        # 为什么不写进 pyproject.toml 的 [tool.coverage.report]：那样本地
        # `pytest --cov=src tests/test_energy.py` 单跑一个文件也会因为「全仓覆盖率不足」而红，
        # 是把 CI 判据塞进开发者日常路径；门禁放 CI 命令行，本地保持自由。
        if: matrix.python-version == '3.11'
        run: |
          .venv/bin/pytest tests/ \
            -v \
            --cov=src \
            --cov-fail-under=44 \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing:skip-covered \
            --junitxml=junit-report.xml \
            --numprocesses=auto \
            --durations=10

      - name: Verify coverage gate can fail (negative control)
        # 同 bandit / pip-audit：阈值型门禁最容易变成摆设（写个永远满意的数字就行），
        # 所以必须证明「低于阈值 -> pytest 真的红」。做法：只跑一个测试文件（覆盖必然远低于 90%），
        # 阈值临时设 90，断言 pytest 非零退出，且失败原因确实是覆盖率（不是测试自己失败）。
        # 报告写进 /tmp，避免覆盖真实运行产出的 coverage.xml / htmlcov（它们随后要当工件上传）。
        # 注：--cov-fail-under 的上限是 100（写 101 会被 argparse 直接拒，实测 exit 4）。
        if: matrix.python-version == '3.11'
        run: |
          if .venv/bin/pytest tests/test_energy.py -q --cov=src --cov-fail-under=90 \
               --cov-report=xml:/tmp/cov-negative-control.xml \
               > /tmp/cov-negative-control.txt 2>&1; then
            echo "::error::coverage 门禁失效：阈值 90 却没有让 pytest 失败"
            tail -20 /tmp/cov-negative-control.txt
            exit 1
          fi
          if ! grep -q "Required test coverage of 90% not reached" /tmp/cov-negative-control.txt; then
            echo "::error::pytest 失败原因不是覆盖率门禁（这条断言防止把真实测试失败当成门禁生效）"
            tail -20 /tmp/cov-negative-control.txt
            exit 1
          fi
          echo "negative control OK：--cov-fail-under 会让 job 红"
          grep "Required test coverage" /tmp/cov-negative-control.txt

      - name: Run tests without coverage
        if: matrix.python-version != '3.11'
        run: |
          .venv/bin/pytest tests/ \
            -v \
            --junitxml=junit-report.xml \
            --numprocesses=auto \
            --durations=10

      - name: Audit installed dependencies (known vulnerabilities)
        # 依赖漏洞门禁（替代改造前那个 `safety check ... || true`）。放在测试 job 的理由：
        # 只有这里装了 requirements.txt 的全量依赖，审计对象才是「CI 真正安装并被测试运行的
        # 依赖集」，含传递依赖；而 `safety check -r requirements.txt` 对 `>=` 形式的依赖
        # 不做解析（会把它们当"未固定版本"跳过），pip-audit 会解析并与漏洞库比对。
        # 判据：pip-audit 退出码 —— 发现未登记的漏洞 -> 非零 -> job 红。
        # 存量登记方式：`--ignore-vuln <ID>`，且必须在此处写明「为什么留 + 何时复查」；
        # 当前清单为空 = 这套依赖上没有已知漏洞。
        if: matrix.python-version == '3.11'
        run: |
          .venv/bin/pip-audit --progress-spinner=off --timeout=30

      - name: Verify dependency-audit gate can fail (negative control)
        # 同 bandit：先证明这个检查本身有效。pyyaml==5.3.1 在漏洞库里有 2 条已知漏洞
        # （实测），--disable-pip + --no-deps 只查库、不解析不安装，确定性且秒级。
        if: matrix.python-version == '3.11'
        run: |
          printf 'pyyaml==5.3.1\n' > /tmp/dep-audit-negative-control.txt
          if .venv/bin/pip-audit --progress-spinner=off --timeout=30 \
               --disable-pip --no-deps -r /tmp/dep-audit-negative-control.txt; then
            echo "::error::依赖审计门禁失效：对已知含 2 个漏洞的 pyyaml==5.3.1 没有报错"
            exit 1
          fi
          echo "negative control OK：pip-audit 对已知有漏洞的输入返回非零"

      - name: Upload coverage report
        if: (matrix.python-version == '3.11') && always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-py${{ matrix.python-version }}
          path: junit-report.xml
          retention-days: 30

  # -------------------------------------------
  # 汇总报告
  # -------------------------------------------
  summary:
    name: CI Summary
    needs: [lint, security, test]
    runs-on: amd64
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check job status
        run: |
          echo "================================"
          echo "CI Pipeline Summary"
          echo "================================"
          echo "Lint:          ${{ needs.lint.result }}"
          echo "Security:      ${{ needs.security.result }}"
          echo "Tests:         ${{ needs.test.result }}"
          echo "================================"

          if [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.security.result }}" = "failure" ] || \
             [ "${{ needs.test.result }}" = "failure" ]; then
            echo "CI Pipeline FAILED"
            exit 1
          else
            echo "CI Pipeline PASSED"
          fi
