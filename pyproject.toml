[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-algorithm"
version = "1.0.0"
description = "LEACH Protocol Simulation & AI Optimization Platform for WSN"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "xfengyin"}
]
keywords = ["WSN", "LEACH", "wireless-sensor-network", "clustering", "AI-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "matplotlib>=3.11.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    # scipy：src/models/network.py 的 cKDTree 真实使用（此前靠 scikit-learn 传递带入）
    "scipy>=1.11.0",
]

# 语义说明（2026-10-15 收窄）：这里只保留有真实使用者的可选项。
# 删掉的：simulation extra（唯一成员 simpy 全仓零 import —— 「事件驱动」是自研队列，
# README 说的「simpy 风格」指设计风格）、lightgbm / shap（零 import）、
# jupyter / ipykernel（零 import；jupyter 一项就带约 80 个传递依赖）。
# AI 依赖只剩 torch，且 CI 装的是 CPU 轮子（runner 无 GPU，CUDA 版多拉 ~2.5GB）。
[project.optional-dependencies]
ai = [
    "torch>=2.14.0",
]
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "black>=23.12.1",
    "isort>=5.13.2",
    "mypy>=1.20.2",
]
all = [
    "torch>=2.14.0",
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
]

[project.scripts]
leach-sim = "main:main"
leach-cli = "cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
