[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-algorithm"
version = "1.0.0"
description = "LEACH Protocol Simulation & AI Optimization Platform for WSN"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "xfengyin"}
]
keywords = ["WSN", "LEACH", "wireless-sensor-network", "clustering", "AI-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "matplotlib>=3.11.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    # scipy：src/models/network.py 的 cKDTree 真实使用（此前靠 scikit-learn 传递带入）
    "scipy>=1.11.0",
]

# 语义说明（2026-10-15 收窄）：这里只保留有真实使用者的可选项。
# 删掉的：simulation extra（唯一成员 simpy 全仓零 import —— 「事件驱动」是自研队列，
# README 说的「simpy 风格」指设计风格）、lightgbm / shap（零 import）、
# jupyter / ipykernel（零 import；jupyter 一项就带约 80 个传递依赖）。
# AI 依赖只剩 torch，且 CI 装的是 CPU 轮子（runner 无 GPU，CUDA 版多拉 ~2.5GB）。
[project.optional-dependencies]
ai = [
    "torch>=2.14.0",
]
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "black>=23.12.1",
    "isort>=5.13.2",
    "mypy>=1.20.2",
]
all = [
    "torch>=2.14.0",
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
]

[project.scripts]
leach-sim = "main:main"
leach-cli = "cli:main"

# 打包布局必须与代码里的 import 路径一致：全仓 45 处写的是 `from src.xxx import ...`
# （cli.py / main.py / examples/* / tests/*），所以 wheel 里的顶层包必须是 `src`
# （而不是把 src/ 里面的目录平铺成顶层 ai/ models/ config/ ...）。
# 2026-10-15 修：原来是 `where = ["src"]` ⇒ 装出来的包叫 ai/ models/ config/ ...，
# `import src.models` 必然 ModuleNotFoundError；此前没炸只是因为从仓库根目录运行时
# CWD 在 sys.path 里、恰好命中了仓库里的 src/（实测：仓库根目录 import src 成功且
# src.__file__ 指向仓库，换到 /tmp 就报 No module named 'src'）。
# 验证方式见 .gitea/workflows/ci.yml 的「Verify built wheel is importable」一步。
[tool.setuptools]
# 两个入口脚本不是 src/ 下的模块，必须显式声明，否则 wheel 里没有 main/cli
# （而 [project.scripts] 的 leach-sim / leach-cli 指向它们）
py-modules = ["main", "cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
